[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-options-gex"
version = "1.0.0"
description = "Crypto Options Analytics & Gamma Exposure (GEX) Engine: Real-Time Market Maker Positioning, Volatility Smile, and Deribit/Binance Integration"
readme = "README.md"
authors = [
  { name = "Costa Junior", email = "adeilsonjc@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]

[project.scripts]
crypto-gex = "crypto_gex.cli:main"

[project.urls]
Homepage = "https://github.com/CostaJr007/crypto-options-gex"
Repository = "https://github.com/CostaJr007/crypto-options-gex"
